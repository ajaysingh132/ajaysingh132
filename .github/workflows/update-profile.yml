name: Update GBSBFORYOU Profile Dashboard

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh dashboard from public GitHub metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit only when dashboard changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh public project dashboard"
            git push
          fi
